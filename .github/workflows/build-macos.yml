name: Build macOS app

# Builds an Apple Silicon "BlackBar Remover.app" with PyInstaller and uploads
# it (zipped) as a workflow artifact. FFmpeg is not bundled; the app finds a
# Homebrew install in /opt/homebrew/bin at runtime.
on:
  workflow_dispatch:
  push:
    paths:
      - blackbar_remove.py
      - assets/**
      - .github/workflows/build-macos.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller pillow  # pillow converts the PNG icon to .icns

      - name: Build .app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "BlackBar Remover" \
            --icon assets/appicon.png \
            --add-data "assets:assets" \
            --target-architecture arm64 \
            blackbar_remove.py

      - name: Smoke test (app starts and stays up)
        run: |
          APP="dist/BlackBar Remover.app/Contents/MacOS/BlackBar Remover"
          file "$APP"
          "$APP" &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then
            echo "App is running"
            kill "$pid"
          else
            wait "$pid"; echo "App exited early (status $?)"; exit 1
          fi

      # Zip with ditto so the symlinks inside the Qt frameworks survive;
      # upload-artifact would otherwise flatten them and break the bundle.
      - name: Zip .app
        run: ditto -c -k --keepParent "dist/BlackBar Remover.app" BlackBarRemover-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BlackBarRemover-macos-arm64
          path: BlackBarRemover-macos-arm64.zip
          retention-days: 30
